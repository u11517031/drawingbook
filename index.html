<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的奇幻繪本之旅 - 電子書</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: 圓潤可愛的中文與英文字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fffbeb',
              100: '#fef3c7',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              800: '#92400e',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'Fredoka', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* 頁面翻轉/滑動動畫 */
    .page-slide {
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease-in-out;
    }
    
    /* 隱藏滾動條但保持滾動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 按鈕浮動與玻璃擬態樣式 */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .glass-dark {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 圖片載入過渡效果 */
    .img-fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="bg-amber-50/50 text-slate-800 font-sans min-h-screen flex flex-col justify-between select-none">

  <!-- ==================== 頂部導覽列 / 標題區 ==================== -->
  <header class="w-full px-4 py-3 glass-card sticky top-0 z-40 shadow-sm flex items-center justify-between">
    <!-- 繪本標題 -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-amber-400 flex items-center justify-center text-amber-900 shadow-inner">
        <i class="fa-solid fa-book-open text-lg"></i>
      </div>
      <div>
        <h1 class="text-lg md:text-xl font-bold text-slate-800 leading-tight" id="book-title">神奇小熊的大冒險</h1>
        <p class="text-xs text-slate-500">互動式繪本電子書</p>
      </div>
    </div>

    <!-- 背景音樂 (BGM) 控制器 -->
    <div class="flex items-center gap-2 bg-amber-100/80 px-3 py-1.5 rounded-full border border-amber-200">
      <button id="bgm-toggle-btn" onclick="toggleBGM()" class="text-amber-800 hover:text-amber-600 transition flex items-center gap-1.5 text-xs md:text-sm font-medium">
        <i id="bgm-icon" class="fa-solid fa-music text-amber-600 animate-pulse"></i>
        <span id="bgm-text" class="hidden sm:inline">背景音樂</span>
      </button>

      <!-- 音量調整條 -->
      <div class="flex items-center gap-1 pl-2 border-l border-amber-300">
        <i class="fa-solid fa-volume-low text-xs text-amber-700"></i>
        <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.3" 
               oninput="changeBGMVolume(this.value)" 
               class="w-16 md:w-20 accent-amber-500 cursor-pointer">
      </div>
    </div>
  </header>

  <!-- ==================== 繪本主體展示區 ==================== -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-6 flex flex-col justify-center items-center">
    
    <!-- 繪本舞台容器 -->
    <div class="w-full bg-white rounded-3xl shadow-2xl border border-amber-100/80 overflow-hidden flex flex-col md:flex-row min-h-[480px] md:min-h-[540px] relative">
      
      <!-- 左側：繪本圖片區 -->
      <div class="w-full md:w-1/2 bg-slate-900 relative min-h-[260px] md:min-h-[480px] flex items-center justify-center overflow-hidden">
        
        <!-- 繪本圖片 (具有漸變效果) -->
        <img id="page-image" 
             src="https://placehold.co/800x800/fef3c7/92400e?text=Page+1+%0A%E5%9C%96%E7%89%87%E8%BC%89%E5%85%A5%E4%B8%AD..." 
             alt="繪本插圖" 
             class="w-full h-full object-cover img-fade-in"
             onerror="this.src='https://placehold.co/800x800/fee2e2/991b1b?text=Image+Load+Error';" />

        <!-- 頁碼標籤 (圖片左上角) -->
        <div class="absolute top-4 left-4 bg-black/50 text-white text-xs px-3 py-1 rounded-full backdrop-blur-md">
          第 <span id="current-page-num" class="font-bold text-amber-400">1</span> / <span id="total-pages-num">5</span> 頁
        </div>
      </div>

      <!-- 右側：文字內容與導覽控制 -->
      <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col justify-between bg-gradient-to-b from-white to-amber-50/30">
        
        <!-- 頁面標題與朗讀按鈕 -->
        <div>
          <div class="flex items-center justify-between border-b border-amber-100 pb-4 mb-4">
            <h2 id="page-subtitle" class="text-xl md:text-2xl font-bold text-slate-800">
              第一頁：森林裡的遇見
            </h2>
            
            <!-- 語音朗讀 (Narration Audio) 控制按鈕 -->
            <button id="narration-btn" onclick="toggleNarration()" 
                    class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-500 hover:bg-amber-600 text-white text-sm font-medium shadow-md hover:shadow-lg transition active:scale-95">
              <i id="narration-icon" class="fa-solid fa-volume-high"></i>
              <span id="narration-text">播放朗讀</span>
            </button>
          </div>

          <!-- 繪本文字內容 -->
          <div class="text-slate-600 leading-relaxed text-base md:text-lg space-y-3 min-h-[140px]" id="page-text">
            陽光透過樹葉撒在森林裡，小熊準備開始他快樂的一天。
          </div>
        </div>

        <!-- 底部切換控制器 (上一頁 / 下一頁) -->
        <div class="pt-6 border-t border-amber-100/60 mt-4">
          
          <!-- 頁碼點點指示器 (Dots Indicator) -->
          <div class="flex justify-center items-center gap-2 mb-4" id="dots-container">
            <!-- 由 JavaScript 動態生成指示點 -->
          </div>

          <!-- 翻頁按鈕列 -->
          <div class="flex items-center justify-between gap-4">
            <button id="prev-btn" onclick="changePage(-1)" 
                    class="flex-1 py-3 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold transition flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
              <i class="fa-solid fa-chevron-left"></i> 上一頁
            </button>

            <button id="next-btn" onclick="changePage(1)" 
                    class="flex-1 py-3 px-4 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold transition flex items-center justify-center gap-2 shadow-md hover:shadow-lg active:scale-98 disabled:opacity-40 disabled:cursor-not-allowed">
              下一頁 <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- ==================== 頁尾資訊 ==================== -->
  <footer class="w-full text-center py-4 text-xs text-slate-400 border-t border-slate-200/50">
    <p>© 2026 學校作業繪本專案 | Designed for GitHub Pages</p>
  </footer>

  <!-- ==================== 隱藏音訊標籤 (HTML5 Audio Elements) ==================== -->
  <!-- 1. 背景音樂 -->
  <!-- 💡 部署說明：請將 src="audio/bgm.mp3" 替換成你的背景音樂路徑 -->
  <audio id="bgm-player" loop preload="auto">
    <source src="audio/bgm.mp3" type="audio/mpeg">
    <!-- 備用免費音樂 (當本地音樂不存在時預設載入) -->
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=kids-cute-story-113262.mp3" type="audio/mpeg">
    您的瀏覽器不支援音訊播放。
  </audio>

  <!-- 2. 頁面朗讀語音 (動態變更 src) -->
  <audio id="narration-player" preload="auto">
    <source id="narration-source" src="" type="audio/mpeg">
  </audio>

  <!-- ==================== 繪本邏輯腳本 (JavaScript) ==================== -->
  <script>
    /* ====================================================================
     * 繪本資料集 (BOOK DATA)
     * 💡 請在這裡修改繪本每一頁的文字、圖片與語音檔路徑！
     * ==================================================================== */
    const storyBook = [
      {
        page: 1,
        title: "第一頁：森林裡的遇見",
        text: "陽光透過樹葉撒在森林裡，小熊蓬蓬踏上了尋找神奇果實的旅程。今天天空特別藍，空氣中散發著花朵的香味。",
        // 💡 替換為你的圖片路徑 (例如: "images/page1.jpg")
        image: "images/page1.jpg", 
        // 💡 預設測試佔位圖 (當本地圖片還沒放進去時自動顯示)
        placeholderImage: "https://placehold.co/800x800/fef3c7/92400e?text=Page+1%0A%E7%AC%AC%E4%B8%80%E9%A0%81%E7%B9%AA%E6%9C%AC%E5%9C%96%E7%89%87",
        // 💡 替換為你的語音檔路徑 (例如: "audio/page1.mp3")
        audio: "audio/page1.mp3"
      },
      {
        page: 2,
        title: "第二頁：小兔子兔子莉莉",
        text: "在清澈的小溪邊，小熊遇見了正在跳舞的小兔子莉莉。「你要去哪裡呀？」莉莉好奇地問道。",
        image: "images/page2.jpg",
        placeholderImage: "https://placehold.co/800x800/e0f2fe/0369a1?text=Page+2%0A%E7%AC%AC%E4%BA%8C%E9%A0%81%E7%B9%AA%E6%9C%AC%E5%9C%96%E7%89%87",
        audio: "audio/page2.mp3"
      },
      {
        page: 3,
        title: "第三頁：穿越彩虹橋",
        text: "他們一起來到了一座五彩繽紛的彩虹橋前。橋下流水潺潺，發出悅耳的咕嚕咕嚕聲。",
        image: "images/page3.jpg",
        placeholderImage: "https://placehold.co/800x800/fce7f3/9d174d?text=Page+3%0A%E7%AC%AC%E4%B8%89%E9%A0%81%E7%B9%AA%E6%9C%AC%E5%9C%96%E7%89%87",
        audio: "audio/page3.mp3"
      },
      {
        page: 4,
        title: "第四頁：發現神奇大樹",
        text: "穿過彩虹橋後，眼前出現了一棵散發著金色光芒的巨樹，樹上結滿了香甜的神果。",
        image: "images/page4.jpg",
        placeholderImage: "https://placehold.co/800x800/dcfce7/15803d?text=Page+4%0A%E7%AC%AC%E5%9B%9B%E9%A0%81%E7%B9%AA%E6%9C%AC%E5%9C%96%E7%89%87",
        audio: "audio/page4.mp3"
      },
      {
        page: 5,
        title: "第五頁：快樂的分享",
        text: "小熊和小兔子摘下了果實，邀請森林裡所有的好朋友一起舉辦營火晚會，度過了難忘的一天。",
        image: "images/page5.jpg",
        placeholderImage: "https://placehold.co/800x800/fae8ff/86198f?text=Page+5%0A%E7%AC%AC%E4%BA%94%E9%A0%81%E7%B9%AA%E6%9C%AC%E5%9C%96%E7%89%87",
        audio: "audio/page5.mp3"
      }
    ];

    // 全局狀態控制
    let currentPageIndex = 0;
    let isBgmPlaying = false;
    let isNarrationPlaying = false;

    // DOM 元素引用
    const bgmPlayer = document.getElementById('bgm-player');
    const narrationPlayer = document.getElementById('narration-player');
    const narrationSource = document.getElementById('narration-source');
    
    const pageImage = document.getElementById('page-image');
    const pageSubtitle = document.getElementById('page-subtitle');
    const pageText = document.getElementById('page-text');
    const currentPageNum = document.getElementById('current-page-num');
    const totalPagesNum = document.getElementById('total-pages-num');
    const dotsContainer = document.getElementById('dots-container');
    
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const narrationBtn = document.getElementById('narration-btn');
    const narrationIcon = document.getElementById('narration-icon');
    const narrationText = document.getElementById('narration-text');

    // 頁面初始化
    window.onload = () => {
      totalPagesNum.innerText = storyBook.length;
      bgmPlayer.volume = 0.3; // 預設背景音樂音量 (30%)
      
      createDots();
      renderPage(currentPageIndex);

      // 監聽語音播放結束事件
      narrationPlayer.onended = () => {
        isNarrationPlaying = false;
        updateNarrationUI();
      };
    };

    // ==================== 頁面切換 logic ==================== //

    function renderPage(index) {
      const pageData = storyBook[index];

      // 停止前一頁正在播放的語音
      stopNarration();

      // 更新內容
      pageSubtitle.innerText = pageData.title;
      pageText.innerText = pageData.text;
      currentPageNum.innerText = pageData.page;

      // 圖片載入失敗時降級處理（自動改載入預設圖）
      pageImage.classList.remove('img-fade-in');
      void pageImage.offsetWidth; // 觸發 reflow 重新播放動畫
      pageImage.classList.add('img-fade-in');

      // 設定圖片來源 (優先嘗試載入使用者設定路徑，若失敗切換佔位圖)
      pageImage.src = pageData.image;
      pageImage.onerror = () => {
        pageImage.src = pageData.placeholderImage;
      };

      // 設定語音來源
      narrationSource.src = pageData.audio;
      narrationPlayer.load();

      // 更新按鈕啟用狀態
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === storyBook.length - 1;

      // 更新指示點狀態
      updateDots(index);
    }

    function changePage(step) {
      const newIndex = currentPageIndex + step;
      if (newIndex >= 0 && newIndex < storyBook.length) {
        currentPageIndex = newIndex;
        renderPage(currentPageIndex);
      }
    }

    function goToPage(index) {
      currentPageIndex = index;
      renderPage(currentPageIndex);
    }

    // 動態生成頁碼點指示器
    function createDots() {
      dotsContainer.innerHTML = '';
      storyBook.forEach((_, idx) => {
        const dot = document.createElement('button');
        dot.className = `w-3 h-3 rounded-full transition-all duration-300 ${idx === 0 ? 'bg-amber-500 w-6' : 'bg-slate-200 hover:bg-amber-300'}`;
        dot.onclick = () => goToPage(idx);
        dot.ariaLabel = `Go to page ${idx + 1}`;
        dotsContainer.appendChild(dot);
      });
    }

    function updateDots(activeIndex) {
      const dots = dotsContainer.children;
      Array.from(dots).forEach((dot, idx) => {
        if (idx === activeIndex) {
          dot.className = 'w-6 h-3 rounded-full bg-amber-500 transition-all duration-300';
        } else {
          dot.className = 'w-3 h-3 rounded-full bg-slate-200 hover:bg-amber-300 transition-all duration-300';
        }
      });
    }

    // ==================== 背景音樂 (BGM) logic ==================== //

    function toggleBGM() {
      const bgmIcon = document.getElementById('bgm-icon');
      const bgmText = document.getElementById('bgm-text');

      if (isBgmPlaying) {
        bgmPlayer.pause();
        isBgmPlaying = false;
        bgmIcon.className = "fa-solid fa-music text-slate-400";
        bgmText.innerText = "播放音樂";
      } else {
        bgmPlayer.play().then(() => {
          isBgmPlaying = true;
          bgmIcon.className = "fa-solid fa-music text-amber-600 animate-pulse";
          bgmText.innerText = "暫停音樂";
        }).catch(err => {
          console.warn("自動播放遭瀏覽器攔截，需使用者互動:", err);
          alert("請點擊頁面任意處後再點擊音樂按鈕播放！");
        });
      }
    }

    function changeBGMVolume(val) {
      bgmPlayer.volume = val;
    }

    // ==================== 語音朗讀 (Narration) logic ==================== //

    function toggleNarration() {
      if (isNarrationPlaying) {
        stopNarration();
      } else {
        playNarration();
      }
    }

    function playNarration() {
      // 播放語音時適度降低背景音樂音量
      if (isBgmPlaying) {
        bgmPlayer.volume = 0.1;
      }

      narrationPlayer.play().then(() => {
        isNarrationPlaying = true;
        updateNarrationUI();
      }).catch(err => {
        console.log("無法播放該頁語音 (可能未上傳 audio/page*.mp3 檔案)");
        // 提供語音朗讀模擬 (Web Speech API 作為預備替代方案)
        speakTextFallback(storyBook[currentPageIndex].text);
      });
    }

    function stopNarration() {
      narrationPlayer.pause();
      narrationPlayer.currentTime = 0;
      isNarrationPlaying = false;
      
      // 恢復背景音樂音量
      const bgmVolumeInput = document.getElementById('bgm-volume');
      if (bgmVolumeInput) {
        bgmPlayer.volume = bgmVolumeInput.value;
      }

      // 如果有在使用 Web Speech API 則停止
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      updateNarrationUI();
    }

    function updateNarrationUI() {
      if (isNarrationPlaying) {
        narrationBtn.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-rose-500 hover:bg-rose-600 text-white text-sm font-medium shadow-md transition active:scale-95";
        narrationIcon.className = "fa-solid fa-square animate-pulse";
        narrationText.innerText = "停止朗讀";
      } else {
        narrationBtn.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-500 hover:bg-amber-600 text-white text-sm font-medium shadow-md transition active:scale-95";
        narrationIcon.className = "fa-solid fa-volume-high";
        narrationText.innerText = "播放朗讀";
      }
    }

    // 當本地沒有提供語音 MP3 時的預備方案：使用瀏覽器內建合成語音
    function speakTextFallback(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 先清空佇列
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 0.9; // 稍微放慢速度適合繪本

        utterance.onstart = () => {
          isNarrationPlaying = true;
          updateNarrationUI();
        };

        utterance.onend = () => {
          isNarrationPlaying = false;
          updateNarrationUI();
        };

        window.speechSynthesis.speak(utterance);
      } else {
        alert("這頁語音檔尚未上傳，且您的瀏覽器不支援內建語音朗讀。");
      }
    }

    // 鍵盤左右方向鍵翻頁
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        changePage(-1);
      } else if (e.key === 'ArrowRight') {
        changePage(1);
      }
    });
  </script>
</body>
</html>
