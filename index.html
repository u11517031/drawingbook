<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動電子書繪本</title>
  <style>
    :root {
      --bg-color: #f7f4ed;
      --card-bg: #ffffff;
      --primary-color: #6c5ce7;
      --primary-hover: #5a4bcf;
      --text-color: #2d3436;
      --accent-color: #ff7675;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .book-container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background-color: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
      gap: 10px;
    }

    .page-indicator {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--primary-color);
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .audio-controls button {
      background: none;
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .audio-controls button:hover {
      background: var(--primary-color);
      color: #fff;
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .volume-box input[type="range"] {
      width: 80px;
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    .image-container {
      position: relative;
      width: 100%;
      height: 480px;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .page-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .spirit-overlay {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 60px;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
      opacity: 0.85;
    }

    .story-section {
      padding: 25px 30px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #fafafa;
      border-top: 1px solid #f0f0f0;
    }

    .story-text {
      font-size: 1.25rem;
      line-height: 1.7;
      color: #333;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #fff;
      border-top: 1px solid #eee;
    }

    .btn-nav {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-nav:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-nav:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-speech {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-speech:hover {
      background: #ee5253;
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="book-container">
    <div class="header-bar">
      <span class="page-indicator" id="pageIndicator">頁數 1 / 20</span>
      <div class="audio-controls">
        <button id="bgmBtn" onclick="toggleBGM()">🎵 背景音樂: 播放</button>
        <div class="volume-box">
          🔊 <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume(this.value)">
        </div>
      </div>
    </div>

    <div class="image-container">
      <img id="pageImg" class="page-img" src="" alt="繪本圖片">
      <img class="spirit-overlay" src="assets/graphics/spirit.png" alt="spirit" onerror="this.style.display='none'">
    </div>

    <div class="story-section">
      <p class="story-text" id="storyText">正在載入故事內容...</p>
    </div>

    <div class="controls-bar">
      <button class="btn-nav" id="prevBtn" onclick="changePage(-1)" disabled>
        <img class="btn-icon" src="assets/graphics/left" alt="←" onerror="tryLoadIcon(this, 'left')">
        上一頁
      </button>
      
      <button class="btn-speech" id="speechBtn" onclick="playSpeech()">
        <img class="btn-icon" src="assets/graphics/read" alt="▶" onerror="tryLoadIcon(this, 'read')">
        語音朗讀
      </button>

      <button class="btn-nav" id="nextBtn" onclick="changePage(1)">
        下一頁
        <img class="btn-icon" src="assets/graphics/right" alt="→" onerror="tryLoadIcon(this, 'right')">
      </button>
    </div>
  </div>

  <audio id="bgmAudio" loop></audio>
  <audio id="speechAudio"></audio>

  <script>
    const totalPages = 20;
    let currentPage = 0;
    let isBGMPlaying = false;
    let currentBGMTrack = null;

    // 嘗試多種副檔名播放聲音
    function tryPlayAudio(audioElem, basePath, callbackSuccess, callbackFail) {
      const extensions = ['.mp3', '', '.wav', '.m4a'];
      let extIndex = 0;

      function attemptNext() {
        if (extIndex >= extensions.length) {
          if (callbackFail) callbackFail();
          return;
        }
        const src = basePath + extensions[extIndex];
        extIndex++;
        audioElem.src = src;
        audioElem.play().then(() => {
          if (callbackSuccess) callbackSuccess();
        }).catch(() => {
          attemptNext();
        });
      }

      attemptNext();
    }

    // 嘗試多種副檔名載入圖片
    function loadImage(imgElem, basePath) {
      const extensions = ['', '.jpg', '.png', '.jpeg', '.gif'];
      let extIndex = 0;

      function attemptNext() {
        if (extIndex >= extensions.length) {
          imgElem.alt = "圖片載入失敗，請確認檔名";
          return;
        }
        const src = basePath + extensions[extIndex];
        extIndex++;
        
        const tempImg = new Image();
        tempImg.onload = () => { imgElem.src = src; };
        tempImg.onerror = () => { attemptNext(); };
        tempImg.src = src;
      }

      attemptNext();
    }

    function tryLoadIcon(imgElem, iconName) {
      loadImage(imgElem, `assets/graphics/${iconName}`);
    }

    function updatePage() {
      // 1. 更新頁碼
      document.getElementById('pageIndicator').innerText = `頁數 ${currentPage + 1} / ${totalPages}`;
      
      // 2. 載入當頁圖片
      const imgElem = document.getElementById('pageImg');
      loadImage(imgElem, `assets/graphics/${currentPage}`);

      // 3. 更新頁面文字
      document.getElementById('storyText').innerText = `第 ${currentPage + 1} 頁的故事內容`;

      // 4. 按鈕狀態
      document.getElementById('prevBtn').disabled = (currentPage === 0);
      document.getElementById('nextBtn').disabled = (currentPage === totalPages - 1);

      // 5. 切換頁面時停止舊語音
      const speechAudio = document.getElementById('speechAudio');
      speechAudio.pause();
      speechAudio.currentTime = 0;
      if (window.speechSynthesis) window.speechSynthesis.cancel();

      // 6. 如果背景音樂正處於播放狀態，切換至對應頁數音樂
      if (isBGMPlaying) {
        loadAndPlayBGM();
      }
    }

    function changePage(direction) {
      currentPage += direction;
      if (currentPage < 0) currentPage = 0;
      if (currentPage >= totalPages) currentPage = totalPages - 1;
      updatePage();
    }

    function loadAndPlayBGM() {
      const bgmAudio = document.getElementById('bgmAudio');
      bgmAudio.volume = document.getElementById('volumeSlider').value;

      tryPlayAudio(bgmAudio, `assets/music/music${currentPage}`, () => {
        isBGMPlaying = true;
        currentBGMTrack = currentPage;
        document.getElementById('bgmBtn').innerText = "⏸ 背景音樂: 暫停";
      }, () => {
        tryPlayAudio(bgmAudio, `assets/music/伴奏`, () => {
          isBGMPlaying = true;
          document.getElementById('bgmBtn').innerText = "⏸ 背景音樂: 暫停";
        }, () => {
          alert("找不到背景音樂檔案，請確認 assets/music/ 資料夾！");
        });
      });
    }

    function toggleBGM() {
      const bgmAudio = document.getElementById('bgmAudio');
      const bgmBtn = document.getElementById('bgmBtn');

      if (isBGMPlaying) {
        // 暫停播放
        bgmAudio.pause();
        isBGMPlaying = false;
        bgmBtn.innerText = "▶ 背景音樂: 繼續播放";
      } else {
        // 如果音訊已有來源且只是暫停，直接 resume 繼續播放
        if (bgmAudio.src && currentBGMTrack === currentPage) {
          bgmAudio.play().then(() => {
            isBGMPlaying = true;
            bgmBtn.innerText = "⏸ 背景音樂: 暫停";
          }).catch(() => loadAndPlayBGM());
        } else {
          // 重新載入對應頁面的背景音樂
          loadAndPlayBGM();
        }
      }
    }

    function changeVolume(val) {
      const bgmAudio = document.getElementById('bgmAudio');
      bgmAudio.volume = val;
    }

    function playSpeech() {
      const speechAudio = document.getElementById('speechAudio');
      tryPlayAudio(speechAudio, `assets/speech/speech${currentPage}`, null, () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(document.getElementById('storyText').innerText);
          utterance.lang = 'zh-TW';
          window.speechSynthesis.speak(utterance);
        } else {
          alert("無法播放語音檔。");
        }
      });
    }

    window.onload = function() {
      updatePage();
      // 初始化設定音量
      document.getElementById('bgmAudio').volume = document.getElementById('volumeSlider').value;
    };
  </script>
</body>
</html>
